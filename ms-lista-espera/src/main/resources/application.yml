server:
  port: 8082

spring:
  application:
    name: ms-lista-espera

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/listas_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    connection-name: ${spring.application.name}

  cloud:
    stream:
      bindings:
        # Auto-assign flow (AsignadorCitasJob)
        citaAsignada-out-0:
          destination: citas-events-exchange
        # Manual doctor decision flow (ListaEsperaService.actualizarParcial)
        citaActualizada-out-0:
          destination: citas-events-exchange
      rabbit:
        bindings:
          citaAsignada-out-0:
            producer:
              routing-key: cita.creada
          citaActualizada-out-0:
            producer:
              routing-key: cita.actualizada

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
