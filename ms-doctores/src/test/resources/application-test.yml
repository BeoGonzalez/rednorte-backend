# Perfil de test aislado: sin PostgreSQL / Redis / RabbitMQ / Eureka reales.
# Permite que @SpringBootTest levante el contexto usando H2 en memoria.
spring:
  datasource:
    url: jdbc:h2:mem:doctores_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  # Cache no-op: evita necesitar un Redis real. El bean CacheManager de Redis
  # sigue creándose (la conexión Lettuce es perezosa y no se abre al arrancar).
  cache:
    type: none

  # Deshabilita el binding del consumidor de RabbitMQ durante los tests.
  cloud:
    stream:
      function:
        definition: ""
    function:
      definition: ""

# Eureka desactivado: no intenta registrarse ni consultar el registro.
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
