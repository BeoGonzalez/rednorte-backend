services:

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rednorte-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # ==========================================
  # --- CAPA DE CACHÉ (REDIS) ---
  # ==========================================
  redis-server:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ==========================================
  # --- BASE DE DATOS UNIFICADA ---
  # ==========================================
  postgres-server:
    image: postgres:15-alpine
    container_name: postgres-server
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # --- MICROSERVICIOS CORE ---
  # ==========================================
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # --- BFF (Backend For Frontend) ---
  # ==========================================
  bff:
    build: ./bff
    container_name: bff
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      EUREKA_URL: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # --- SEGURIDAD Y AUTENTICACIÓN ---
  # ==========================================
  security:
    build: ./security
    container_name: security
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      EUREKA_URL: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-server:5432/security_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SPRING_DATA_REDIS_HOST: redis-server
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-server:
        condition: service_healthy
      redis-server:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # --- DOMINIO DE PACIENTES ---
  # ==========================================
  ms-pacientes:
    build: ./ms-pacientes
    container_name: ms-pacientes
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      EUREKA_URL: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-server:5432/pacientes_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis-server
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-server:
        condition: service_healthy
      redis-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # --- DOMINIO DE DOCTORES (MÉDICOS) ---
  # ==========================================
  ms-doctores:
    build: ./ms-doctores
    container_name: ms-doctores
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      EUREKA_URL: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-server:5432/doctores_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis-server
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-server:
        condition: service_healthy
      redis-server:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # --- LISTAS DE ESPERA ---
  # ==========================================
  ms-lista-espera:
    build: ./ms-lista-espera
    container_name: ms-lista-espera
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      EUREKA_URL: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-server:5432/listas_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SPRING_DATA_REDIS_HOST: redis-server
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-server:
        condition: service_healthy
      redis-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # --- ASISTENTE DE IA (CHATBOT) ---
  # ==========================================
  ms-chatbot:
    build: ./ms-chatbot
    container_name: ms-chatbot
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      EUREKA_URL: http://eureka-server:8761/eureka
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # --- GATEWAY PERIMETRAL ---
  # ==========================================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy

# 🟢 IMPORTANTE: Este bloque define el volumen y DEBE estar al final, pegado al margen izquierdo
volumes:
  postgres-data: