# Perfil de test aislado: sin PostgreSQL / Redis / Eureka reales.
spring:
  datasource:
    url: jdbc:h2:mem:security_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  data:
    redis:
      repositories:
        enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Clave HS256 en Base64 usada solo para los tests (no es un secreto real).
jwt:
  secret:
    key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
