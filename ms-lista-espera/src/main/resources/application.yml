server:
  port: 8082

spring:
  application:
    name: ms-lista-espera

  datasource:
    url: jdbc:h2:mem:listas_db;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      # Apunta al contenedor de Eureka
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    # NUEVO: Fundamental para que Eureka sepa cómo rutear el tráfico a este microservicio en Docker
    prefer-ip-address: true