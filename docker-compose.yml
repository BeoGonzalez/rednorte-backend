version: '3.8'

services:

  # --- BASES DE DATOS ---
  postgres-pacientes:
    image: postgres:15-alpine
    container_name: postgres-pacientes
    environment:
      POSTGRES_DB: pacientes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432" # Puerto estándar de Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pacientes_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-lista-espera:
    image: postgres:15-alpine
    container_name: postgres-lista-espera
    environment:
      POSTGRES_DB: listas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432" # Mapeado al 5433 en tu PC local para no chocar con el otro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d listas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- MICROSERVICIOS CORE ---
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ms-pacientes:
    build: ./ms-pacientes
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      EUREKA_URL: http://eureka-server:8761/eureka
      # Le pasamos las credenciales de BD por variable de entorno (Buena práctica)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-pacientes:5432/pacientes_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-pacientes:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ms-lista-espera:
    build: ./ms-lista-espera
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      EUREKA_URL: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-lista-espera:5432/listas_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-lista-espera:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- GATEWAY ---
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server

  security:
    build: ./security
    container_name: security
    ports:
      - "8083:8083" # O el puerto interno que le asignes
    environment:
      SERVER_PORT: 8083
      EUREKA_URL: http://eureka-server:8761/eureka
      # Aquí también irán las variables de su propia base de datos (ej. auth_db)
    depends_on:
      eureka-server:
        condition: service_healthy