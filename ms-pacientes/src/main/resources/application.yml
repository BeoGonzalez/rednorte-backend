server:
  port: 8081

spring:
  application:
    name: ms-pacientes

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pacientes_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cache:
    type: redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    connection-name: ${spring.application.name}

  cloud:
    stream:
      function:
        definition: procesarCitaAsignada;procesarCitaActualizada
      bindings:
        # Auto-assign events (routing key: cita.creada)
        procesarCitaAsignada-in-0:
          destination: citas-events-exchange
          group: ms-pacientes-asignada-group
        # Manual doctor decision events (routing key: cita.actualizada)
        procesarCitaActualizada-in-0:
          destination: citas-events-exchange
          group: ms-pacientes-actualizada-group
      rabbit:
        bindings:
          procesarCitaAsignada-in-0:
            consumer:
              binding-routing-key: cita.creada
          procesarCitaActualizada-in-0:
            consumer:
              binding-routing-key: cita.actualizada

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
