server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      # NUEVA ESTRUCTURA SPRING CLOUD 2025
      server:
        webflux:
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: ruta-pacientes
              uri: lb://ms-pacientes
              predicates:
                - Path=/api/pacientes/**

            - id: ruta-lista-espera
              uri: lb://ms-lista-espera
              predicates:
                - Path=/api/listas-espera/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/