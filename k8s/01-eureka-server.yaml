apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: rednorte
  labels:
    app: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: 174448597449.dkr.ecr.us-east-1.amazonaws.com/rednorte-eureka-server
          ports:
            - containerPort: 8761
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: rednorte
spec:
  ports:
    - port: 8761
      targetPort: 8761
  selector:
    app: eureka-server
  type: ClusterIP