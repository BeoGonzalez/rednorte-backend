# Perfil de test aislado: sin PostgreSQL / Redis / RabbitMQ / Eureka reales.
spring:
  datasource:
    url: jdbc:h2:mem:pacientes_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  cache:
    type: none
  data:
    redis:
      repositories:
        enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
