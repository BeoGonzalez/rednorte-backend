version: '3.8'

services:

  # ==========================================
  # --- BASE DE DATOS UNIFICADA ---
  # ==========================================
  postgres-server:
    image: postgres:15-alpine
    container_name: postgres-server
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres # Base de datos por defecto al iniciar
    ports:
      - "5432:5432" # Un solo puerto local para administrar todo en DBeaver
    volumes:
      # Inyecta el script para crear las 3 bases de datos automáticamente
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  # ==========================================
  # --- MICROSERVICIOS CORE ---
  # ==========================================
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # --- BFF (Backend For Frontend) ---
  # ==========================================
  bff:
    build: ./bff
    container_name: bff
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      EUREKA_URL: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped

  security:
    build: ./security
    container_name: security
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      EUREKA_URL: http://eureka-server:8761/eureka
      # 🔴 Apunta al contenedor maestro
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-server:5432/security_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-server:
        condition: service_healthy
    restart: unless-stopped

  ms-pacientes:
    build: ./ms-pacientes
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      EUREKA_URL: http://eureka-server:8761/eureka
      # 🔴 Apunta al contenedor maestro
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-server:5432/pacientes_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ms-lista-espera:
    build: ./ms-lista-espera
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      EUREKA_URL: http://eureka-server:8761/eureka
      # 🔴 Apunta al contenedor maestro
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-server:5432/listas_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ms-chatbot:
    build: ./ms-chatbot
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      EUREKA_URL: http://eureka-server:8761/eureka
      GITHUB_TOKEN: ${GITHUB_TOKEN} # Esta variable la tomará de tu archivo .env
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # --- GATEWAY ---
  # ==========================================
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server