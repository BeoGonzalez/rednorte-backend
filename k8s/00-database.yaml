apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: rednorte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "rednorte"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "pasword"
---
apiVersion: v1
kind: Service
metadata:
  # ESTE ES EL NOMBRE QUE USARÁN LOS MICROSERVICIOS
  name: postgres-service
  namespace: rednorte
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres